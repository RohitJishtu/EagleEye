[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eagleeye"
version = "0.1.0"
description = "AI-powered code review CLI for tech leads"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "mcp>=1.0.0,<2",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-yaml>=0.6.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
lineage = [
    "pandas>=2.0",
    "snowflake-connector-python>=3.0",
]
webhook = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
scheduler = [
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0.0",
]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "pytest-httpx",
    "ruff>=0.4",
    "mypy>=1.10",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0",
    "snowflake-connector-python>=3.0",
]

[project.scripts]
eagleeye = "eagleeye.main:app"
eagleeye-mcp = "eagleeye.servers.mcp.server:run"
eagleeye-webhook = "eagleeye.webhook.server:run_server"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real GITHUB_TOKEN and ANTHROPIC_API_KEY"]
